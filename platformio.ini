[env:esp32-s3-epaper-13in3e]
; PlatformIO's official espressif32 platform lags upstream arduino-esp32 —
; it resolves to the old IDF4.4-based 2.x core, which lacks ESP_I2S.h and
; the esp_adc/adc_cali.h calibration API that Waveshare's own examples (and
; this firmware) use. pioarduino's platform-espressif32 fork tracks current
; arduino-esp32 3.x (IDF5) releases; see github.com/pioarduino/platform-espressif32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.1.195
framework = arduino

; ESP32-S3-WROOM-2-N32R16V: 32MB flash, 16MB octal PSRAM.
board_upload.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; CH334 USB-hub + CH343 UART chip handle the physical Type-C port; the
; native USB-CDC path must stay off so Serial reliably goes over CH343
; instead of racing the two (see teatall/13.3inch_e-Paper_E-Frame notes).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Sync WebServer (used only for WiFi provisioning) buffers a request's
; whole body into a plain-heap String before handlers run — fine for a
; ~100-byte SSID/password form, but would try to put the 960,000-byte
; .bin upload straight into 512KB of internal SRAM and crash. The main
; API server uses ESPAsyncWebServer instead so /api/image can stream
; each chunk straight into a PSRAM buffer via onBody().
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
